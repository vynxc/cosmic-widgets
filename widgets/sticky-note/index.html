<article class="widget note" aria-label="Sticky note">
  <header><span>Note</span><i aria-hidden="true"></i></header>
  <textarea data-cw-storage="note.text" data-cw-on-input="storage.write" aria-label="Note text" placeholder="Write something…"></textarea>
  <footer><span data-cw-text="storage.saved_state">Saved locally</span></footer>
</article>
