<article class="widget monitor" aria-label="System monitor">
  <header><strong>System</strong><span data-cw-text="system.hostname">cosmic</span></header>
  <section class="hero">
    <div><span class="metric" data-cw-text="system.cpu_percent">18%</span><small>CPU</small></div>
    <div class="meter"><i data-cw-style-value="system.cpu_percent"></i></div>
  </section>
  <div class="grid">
    <div><small>Memory</small><b data-cw-text="system.memory_used">6.8 GB</b></div>
    <div><small>Disk</small><b data-cw-text="system.disk_used">212 GB</b></div>
    <div><small>Down</small><b data-cw-text="system.network_down">1.2 MB/s</b></div>
  </div>
</article>
