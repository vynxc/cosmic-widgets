<article class="widget media" aria-label="Media controls">
  <div class="art" data-cw-style-image="media.art_url"><span>♪</span></div>
  <section>
    <span class="source" data-cw-text="media.player">Media</span>
    <strong data-cw-text="media.title">Nothing playing</strong>
    <p data-cw-text="media.artist">Choose something to listen to</p>
    <nav aria-label="Playback controls">
      <button data-cw-on-click="media.previous" aria-label="Previous">‹</button>
      <button class="play" data-cw-on-click="media.toggle" aria-label="Play or pause">▶</button>
      <button data-cw-on-click="media.next" aria-label="Next">›</button>
    </nav>
  </section>
</article>
